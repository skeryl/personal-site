name: Deploy to GitHub Pages
# A quilt-client release names itself here, so a deploy that came from the
# builder is legible in the Actions list rather than looking like a rebuild.
run-name: >-
  Deploy${{ github.event.client_payload.version && format(' (quilt-client {0})',
  github.event.client_payload.version) || '' }}

on:
  push:
    branches: 'main'
  # The quilt builder lives in skeryl/quilt-builder now. Publishing there tells
  # this site to rebuild, so the newest builder reaches the journal without a
  # commit here.
  repository_dispatch:
    types: [quilt-release]

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The lockfile pins whatever was current when someone last installed.
      # A deploy should carry whatever quilt-builder published most recently,
      # including a release that dispatched this very run, so ask for it by
      # name rather than trusting a tag to re-resolve past the lockfile.
      - name: Take the newest quilt builder
        run: npm install @skeryl/quilt-client@latest -w @sc/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: npm run build -w @sc/ui

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'packages/ui/build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4