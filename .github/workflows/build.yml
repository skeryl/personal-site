name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  # Best effort: a cancelled run or an Actions outage leaves the project
  # behind, which is what preview-sweep.yml is for.
  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview
        uses: skeryl/disco-preview@v1
        with:
          mode: teardown
          project: site-pr-${{ github.event.number }}
          disco-host: ${{ secrets.DISCO_HOST }}
          disco-api-key: ${{ secrets.DISCO_API_KEY }}

  check:
    name: Type Check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: svelte-check
        run: npm run check -w @sc/ui

  lint:
    name: Lint
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format auto-generated files
        working-directory: packages/ui
        run: npx prettier --write src/lib/entries/index.ts src/lib/assets/videos/posts/index.ts
      - name: prettier
        working-directory: packages/ui
        run: npx prettier --check .

  test:
    name: Unit Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: vitest
        working-directory: packages/ui
        run: npx vitest run

  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build -w @sc/ui
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: packages/ui/build/

  preview:
    name: Preview Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      # Video is 78MB of the 98MB build, and a preview is the one place it
      # earns the least. Images are 13MB and stay: they are worth looking at.
      # The patterns need **/ to reach anything under _app/immutable/assets.
      - name: Deploy to Disco
        uses: skeryl/disco-preview@v1
        with:
          project: site-pr-${{ github.event.number }}
          dir: build
          exclude: |
            **/*.mp4
            **/*.webm
            **/*.mov
          disco-host: ${{ secrets.DISCO_HOST }}
          disco-api-key: ${{ secrets.DISCO_API_KEY }}

  smoke:
    name: Smoke Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The quilt builder installs from GitHub Packages, which wants a
          # token even though the package is ours.
          registry-url: https://npm.pkg.github.com
          scope: '@skeryl'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright
        working-directory: packages/ui
        run: npx playwright install chromium --with-deps
      - name: Playwright smoke tests
        working-directory: packages/ui
        run: npx playwright test
